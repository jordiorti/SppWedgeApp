name: Compilar APK Android

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip python3-setuptools \
            python3-virtualenv python3-dev autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev lld

      - name: Instalar Buildozer y Cython
        run: |
          pip3 install --upgrade pip
          pip3 install --user cython==0.29.36 buildozer

      - name: Añadir pip al PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Compilar APK con Buildozer
        run: buildozer -v android debug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: spp-wedge-apk
          path: bin/*.apk
